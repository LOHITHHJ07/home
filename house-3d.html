<style>

}

  --surface:rgba(22,30,33,.82); --ink:#e8efee; --muted:#9fb0b2; --line:rgba(232,239,238,.16);

:root[data-theme="dark"]{ --surface:rgba(22,30,33,.82); --ink:#e8efee; --muted:#9fb0b2; --line:rgba(232,239,238,.16);
  --accent:#7cc3b1; --accent-ink:#0f1a18; --page:#1a2326; color-scheme:dark; }
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}

.title{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;max-width:min(78vw,340px)}
.title h1{font-size:16px;font-weight:600;margin:0 0 2px}
.title p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;
  background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:999px;padding:5px;max-width:calc(100vw - 20px);overflow-x:auto}
.bar button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));font-size:12px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:7px 10px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
@media (max-width:560px){.hint{display:none}.title p{font-size:12px}}
</style>
</head>

<div class="title">
  <h1>Your home — OPT-01, revised</h1>

</div>
<div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<nav class="bar" aria-label="Choose a view">
  <button data-f="3" aria-pressed="true">Whole house</button>
  <button data-f="0" aria-pressed="false">Ground</button>
  <button data-f="1" aria-pressed="false">First</button>
  <button data-f="2" aria-pressed="false">Second</button>
  <button id="spin" aria-pressed="false">Turntable</button>

// ---------- procedural textures ----------
function canvasTex(size,draw,rep=1){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');draw(x,size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function noise(x,s,base,amp,n=4000){x.fillStyle=base;x.fillRect(0,0,s,s);for(let i=0;i<n;i++){const v=(Math.random()-.5)*amp;
  x.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)})`;x.fillRect(Math.random()*s,Math.random()*s,2,2);}}
const tex={
  tile:canvasTex(256,(x,s)=>{noise(x,s,'#e9e4dc',0.06);x.strokeStyle='rgba(120,110,100,.35)';x.lineWidth=3;x.strokeRect(0,0,s,s);},0.5),
  wood:canvasTex(256,(x,s)=>{x.fillStyle='#8a5a36';x.fillRect(0,0,s,s);for(let i=0;i<60;i++){x.strokeStyle=`rgba(${60+Math.random()*40},${35+Math.random()*25},20,.35)`;
      x.beginPath();const y=Math.random()*s;x.moveTo(0,y);x.bezierCurveTo(s*.3,y+6,s*.6,y-6,s,y+2);x.stroke();}},1),
  grass:canvasTex(256,(x,s)=>noise(x,s,'#5d7f3a',0.18,9000),0.08),
  asphalt:canvasTex(256,(x,s)=>noise(x,s,'#3d4144',0.12,9000),0.1),
  paver:canvasTex(256,(x,s)=>{noise(x,s,'#b9b0a2',0.08);x.strokeStyle='rgba(80,70,60,.4)';x.lineWidth=2;
      for(let r=0;r<4;r++)for(let c=0;c<2;c++){x.strokeRect(c*128+(r%2)*64,r*64,128,64);}},0.33),
  terra:canvasTex(256,(x,s)=>{noise(x,s,'#b8714c',0.1);x.strokeStyle='rgba(90,45,25,.45)';x.lineWidth=3;x.strokeRect(0,0,s,s);},0.6),
  plaster:canvasTex(256,(x,s)=>noise(x,s,'#efebe4',0.035,6000),0.2),

const M={
  wall:new THREE.MeshStandardMaterial({map:tex.plaster,roughness:0.92}),
  accent:new THREE.MeshStandardMaterial({color:0x6d7a7c,roughness:0.85}),
  clad:new THREE.MeshStandardMaterial({map:tex.wood,roughness:0.6}),

  slab:new THREE.MeshStandardMaterial({color:0xe7e2da,roughness:0.9,side:THREE.DoubleSide}),
  terrace:new THREE.MeshStandardMaterial({map:tex.terra,roughness:0.8,side:THREE.DoubleSide}),
  paver:new THREE.MeshStandardMaterial({map:tex.paver,roughness:0.9}),
  grass:new THREE.MeshStandardMaterial({map:tex.grass,roughness:1}),
  road:new THREE.MeshStandardMaterial({map:tex.asphalt,roughness:0.95}),

// ---------- helpers ----------
const FH=10, WH=9.5;
const groups=[0,1,2,3].map(()=>{const g=new THREE.Group();scene.add(g);return g;});

function B(x0,y0,z0,x1,y1,z1,mat,g){const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)),mat);

      const pane=(a,b,y0,y1,m,th)=>hz?B(a,base+y0,mid-th,b,base+y1,mid+th,m,g):B(mid-th,base+y0,a,mid+th,base+y1,b,m,g);
      pane(s,e,sl,hd,M.glass,0.05);
      pane(s,s+0.15,sl,hd,M.frame,0.12);pane(e-0.15,e,sl,hd,M.frame,0.12);pane(s,e,hd-0.15,hd,M.frame,0.12);
      if(sl>0)pane(s,e,sl,sl+0.15,M.frame,0.12);
      if(t==='glass')pane((s+e)/2-0.08,(s+e)/2+0.08,sl,hd,M.frame,0.12);
    }
    if(t==='main'){const w=(e-s)/2; hz?B(s,base,mid-0.08,s+w-0.05,base+7.4,mid+0.08,M.woodF,g):B(mid-0.08,base,s,mid+0.08,base+7.4,s+w-0.05,M.woodF,g);}
    cur=e;}
  seg(cur,a1,0,h);

function slab(g,y,x0,z0,x1,z1,holes,mat,th=0.5){
  const s=new THREE.Shape();s.moveTo(x0,z0);s.lineTo(x1,z0);s.lineTo(x1,z1);s.lineTo(x0,z1);s.lineTo(x0,z0);

  m.position.set((x0+x1)/2,(y0+y1)/2,z);m.rotation.z=Math.atan2(y1-y0,x1-x0);m.castShadow=true;g.add(m);}

  B(xe,base+4.4,a[0],xl,base+5,b[1],M.stone,g);
  for(let j=0;j<n;j++){const top=5+(j+1)*r;B(xe-(j+1)*run,base+top-r-0.6,b[0],xe-j*run,base+top,b[1],M.stone,g);}

  rail(g,xs,base+3.3,xe,base+8.3,18.87); rail(g,xe,base+8.3,xs,base+13.3,18.87);
  for(let i=0;i<=n;i+=3){const x=xs+i*run;B(x-0.05,base+i*r,18.82,x+0.05,base+i*r+3.3,18.92,M.steel,g);
    const x2=xe-i*run;B(x2-0.05,base+5+i*r,18.82,x2+0.05,base+5+i*r+3.3,18.92,M.steel,g);}
}
function bed(g,base,x0,z0,x1,z1,sides=true){B(x0,base,z0,x1,base+1.2,z1,M.woodF,g);B(x0+0.15,base+1.2,z0+0.15,x1-0.15,base+1.9,z1-0.15,M.linen,g);
  B(x0+0.2,base+1.9,z0+0.2,x0+3.2,base+1.95,z1-0.2,M.fabric,g);
  B(x1-0.35,base,z0-0.1,x1,base+3.8,z1+0.1,M.clad,g);
  const zm=(z0+z1)/2;B(x1-1.6,base+1.9,z0+0.4,x1-0.5,base+2.3,zm-0.2,M.linen,g);B(x1-1.6,base+1.9,zm+0.2,x1-0.5,base+2.3,z1-0.4,M.linen,g);
  if(sides){B(x1-1.6,base,z0-1.9,x1-0.2,base+1.8,z0-0.3,M.woodF,g);B(x1-1.6,base,z1+0.3,x1-0.2,base+1.8,z1+1.9,M.woodF,g);}}
function wardrobe(g,base,x0,z0,x1,z1){B(x0,base,z0,x1,base+7.5,z1,M.clad,g);}
function wc(g,base,x,z,rot=0){const m=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.45,1.3,20),M.white);
  b.position.set(0,0.65,0);b.scale.z=1.35;const t=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.0,0.5),M.white);t.position.set(0,1.3,-0.95);

function sofaL(g,base,x0,z0,x1,z1,armZ){B(x0,base,z0,x1,base+1.4,z0+2.8,M.sofa,g);B(x0,base,z0,x0+2.8,base+1.4,z1,M.sofa,g);
  B(x0,base+1.4,z0,x1,base+2.8,z0+0.7,M.sofa,g);B(x0,base+1.4,z0,x0+0.7,base+2.8,z1,M.sofa,g);}
function label(fl,x,z,text){const c=document.createElement('canvas');c.width=512;c.height=128;const k=c.getContext('2d');
  k.font='600 44px "Instrument Sans", system-ui, sans-serif';const w=k.measureText(text).width+48;
  k.fillStyle='rgba(255,255,255,.92)';k.beginPath();k.roundRect((512-w)/2,24,w,80,40);k.fill();

// glass + steel railing around an opening; sides = [z0 edge, z1 edge, x0 edge, x1 edge]
function lightRail(g,base,x0,z0,x1,z1,sides=[1,1,1,1]){const h=3.4,t=0.06;
  const seg=(a,b,c,d)=>{B(a,base,b,c,base+h-0.2,d,M.glass,g);B(a,base+h-0.2,b,c,base+h,d,M.steel,g);};

// ---------- site ----------
const site=new THREE.Group();scene.add(site);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(600,600),M.grass);grass.rotation.x=-Math.PI/2;grass.position.set(15,-1.55,0);grass.receiveShadow=true;site.add(grass);
B(0,-1.6,0,30,-1.45,40,M.paver,site);
B(-120,-1.6,40.5,150,-1.5,46,M.curb,site);
B(-120,-1.62,46,150,-1.52,74,M.road,site);

B(-120,-1.6,74,150,-1.45,79,M.curb,site);
B(0,-1.5,0,30,3.5,0.5,M.wall,site);B(0,-1.5,0,0.5,3.5,40,M.wall,site);B(29.5,-1.5,0,30,3.5,40,M.wall,site);
for(let x=1.8;x<12.4;x+=0.55)B(x,-1.5,40.1,x+0.12,3,40.25,M.frame,site);B(1.6,2.9,40.05,12.4,3.1,40.3,M.frame,site);

  for(const [dx,dy,dz,r] of [[0,9,0,4.2],[2,7.5,1,3],[-2,8,-1,3.2],[0.5,11,0.5,3]]){const l=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1),M.leaf);
    l.position.set(x+dx*s,-1.5+dy*s,z+dz*s);l.castShadow=true;site.add(l);}}
tree(-8,43,1.2);tree(38,43,1.1);tree(-10,12,1.3);tree(41,8,1.2);tree(70,43,1);tree(-40,43,1.1);

// ---------- GROUND (level 0) ----------
const G0=groups[0], b0=0;

slab(G0,0.02,1.5,4.9,12.6,24.3,[],M.floor,0.04);slab(G0,0.02,12.6,1.5,29.25,35.4,[],M.floor,0.04);
B(12.6,-1.5,35.4,17.4,-0.75,37.2,M.stone,G0);B(12.6,-1.5,37.2,17.4,-1.1,38.6,M.stone,G0);
wall(G0,b0,1.5,4.9,2.25,40,[[8,11.5,'window'],[19,22,'window']]);
wall(G0,b0,1.5,4.9,12.6,5.55,[[9.4,11.4,'door'],[3.5,7,'window']]);
wall(G0,b0,12.6,1.5,29.25,2.25,[[14.2,15.8,'vent'],[20,24.5,'window']]);
wall(G0,b0,12.6,2.25,13.3,11.6);
